<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" role="img" aria-label="KaljiHome Icon">
  <defs>
    <linearGradient id="warmTerracottaIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="calmTealIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Container with soft rounded squircle -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="#F0FDFA" stroke="#CCFBF1" stroke-width="2.5" />

  <!-- Hands / Roof / Heart composition -->
  <g transform="translate(10, 10)" filter="url(#iconShadow)">
    <!-- Roof peak accent -->
    <path d="M50 14 L28 34 L33 37 L50 21 L67 37 L72 34 Z" fill="url(#warmTerracottaIcon)" />

    <!-- Protective Home Arch formed by caring hands -->
    <path d="M22 56 C24 38, 38 24, 50 18 C62 24, 76 38, 78 56 C74 54, 68 50, 64 52 C58 54, 54 44, 50 42 C46 44, 42 54, 36 52 C32 50, 26 54, 22 56 Z" 
          fill="url(#calmTealIcon)" />

    <!-- Lower supporting palms -->
    <path d="M26 62 C26 76, 36 84, 50 84 C64 84, 74 76, 74 62 C68 66, 62 66, 58 63 C54 60, 52 64, 50 64 C48 64, 46 60, 42 63 C38 66, 32 66, 26 62 Z" 
          fill="url(#calmTealIcon)" opacity="0.9" />

    <!-- Radiant Inner Care Heart -->
    <path d="M50 46 C44 40, 37 46, 37 52 C37 60, 47 67, 50 70 C53 67, 63 60, 63 52 C63 46, 56 40, 50 46 Z" 
          fill="url(#warmTerracottaIcon)" />

    <!-- Heart spark -->
    <circle cx="50" cy="53" r="3.5" fill="#FEF3C7" />
  </g>
</svg>
